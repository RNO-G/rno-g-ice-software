# Per-station overrides for rno-g-acq.
#
# Station resolution order (first hit wins):
#   1. --station on the CLI
#   2. contents of the file below
station_source:
  file: /STATION_ID

# Applied to every station first.
defaults:
  calib:
    enable_cal: 1
    channel: fiber0
    type: pulser
    atten: 5.0  # may be overwritten by station specific values
  output:
    seconds_per_run: 300

# Deep-merged on top of defaults; the station block wins per leaf.
# Keys are matched as strings
stations:
  11:
    calib:
      atten: 5.0
  21:
    calib:
      atten: 5.0
